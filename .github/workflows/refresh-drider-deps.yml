name: Refresh Drider dependency baseline

on:
  push:
    branches:
      - chore/drider-phase0-1-baseline

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/drider-phase0-1-baseline
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Upgrade incompatible Google Fonts baseline
        shell: python
        run: |
          from pathlib import Path
          path = Path('pubspec.yaml')
          text = path.read_text()
          old = '  google_fonts: ^6.3.0'
          new = '  google_fonts: ^8.2.1'
          if old in text:
              path.write_text(text.replace(old, new))

      - name: Regenerate dependency lock
        run: flutter pub get

      - name: Commit deterministic dependency baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml pubspec.lock analysis_options.yaml
          if git diff --cached --quiet; then
            echo "Dependency baseline already current."
            exit 0
          fi
          git commit -m "fix: refresh Drider dependency baseline"
          git push origin HEAD:chore/drider-phase0-1-baseline
