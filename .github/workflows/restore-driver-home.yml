name: restore-driver-home
on:
  push:
    branches: [polish/bottom-sheet-icons-radar-dash]
    paths:
      - "lib/presentation/driver/home/_restore_chunks/**"
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/bottom-sheet-icons-radar-dash
          fetch-depth: 0
      - name: Assemble home.dart from chunks when complete
        run: |
          set -euo pipefail
          dest="lib/presentation/driver/home/home.dart"
          chunk_dir="lib/presentation/driver/home/_restore_chunks"
          if [ ! -d "$chunk_dir" ]; then
            echo "No chunk dir; nothing to do"
            exit 0
          fi
          count=$(ls "$chunk_dir"/home_chunk_*.txt 2>/dev/null | wc -l | tr -d ' ')
          echo "Found $count chunks"
          if [ "$count" -lt 5 ]; then
            echo "Waiting for all 5 chunks"
            exit 0
          fi
          cat "$chunk_dir"/home_chunk_*.txt > "$dest"
          rm -rf "$chunk_dir"
          rm -f lib/presentation/driver/home/_mcp_write_probe.txt \
                lib/presentation/driver/home/_mcp_size_probe_5k.dart \
                lib/presentation/driver/home/_mcp_size_probe_20k.dart \
                .github/workflows/restore-driver-home.yml
          echo "Assembled lines: $(wc -l < "$dest")"
          grep -n "DriverSheetNav\|_buildTripRadarButton\|onlineEdgeDashOverlay" "$dest" | head
          test "$(wc -l < "$dest")" -gt 1500
          git config user.name "baccarisverige-ux"
          git config user.email "baccari.sverige@gmail.com"
          git add -A
          git status
          git commit -m "fix(home): restore full main home.dart with DriverSheetNav + edge dash"
          git push origin HEAD:polish/bottom-sheet-icons-radar-dash
