name: Extract uploaded project archives

on:
  push:
    branches:
      - chore/extract-uploaded-project

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extraction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct project from uploaded ZIP parts
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .project-extracted ]; then
            echo "Project already extracted; nothing to do."
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import shutil
          import sys

          repo = Path.cwd()
          archives = [
              repo / 'driver-part-1-source.zip',
              repo / 'driver-part-2-assets.zip',
              repo / 'driver-part-3-mobile-web.zip',
              repo / 'driver-part-4-project-files.zip',
          ]
          missing = [p.name for p in archives if not p.exists()]
          if missing:
              raise SystemExit(f"Missing uploaded archive(s): {', '.join(missing)}")

          temp = repo / '.extract-work'
          merged = temp / 'merged'
          if temp.exists():
              shutil.rmtree(temp)
          merged.mkdir(parents=True)

          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          conflicts = []
          archive_stats = []
          ignored_names = {'.DS_Store'}

          for index, archive in enumerate(archives, start=1):
              part = temp / f'part-{index}'
              part.mkdir(parents=True)
              with ZipFile(archive) as zf:
                  bad = zf.testzip()
                  if bad is not None:
                      raise SystemExit(f"Corrupt ZIP member in {archive.name}: {bad}")
                  zf.extractall(part)

              files = []
              for src in sorted(part.rglob('*')):
                  if not src.is_file():
                      continue
                  rel = src.relative_to(part)
                  if '__MACOSX' in rel.parts or src.name in ignored_names:
                      continue
                  # Never allow an uploaded archive to replace this temporary extraction workflow.
                  if rel.as_posix() == '.github/workflows/extract-uploaded-project.yml':
                      continue
                  files.append(rel)
                  dst = merged / rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  if dst.exists():
                      if digest(src) != digest(dst):
                          conflicts.append((rel.as_posix(), archive.name))
                      continue
                  shutil.copy2(src, dst)
              archive_stats.append((archive.name, len(files)))

          if conflicts:
              print('Conflicting duplicate paths detected:', file=sys.stderr)
              for path, archive in conflicts:
                  print(f'  {path} ({archive})', file=sys.stderr)
              raise SystemExit(2)

          merged_files = [p for p in merged.rglob('*') if p.is_file()]
          if not merged_files:
              raise SystemExit('Extraction produced no files.')

          protected = {
              'driver-part-1-source.zip',
              'driver-part-2-assets.zip',
              'driver-part-3-mobile-web.zip',
              'driver-part-4-project-files.zip',
              '.github/workflows/extract-uploaded-project.yml',
          }
          for src in merged_files:
              rel = src.relative_to(merged)
              rel_text = rel.as_posix()
              if rel_text in protected:
                  continue
              dst = repo / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          top = sorted({p.relative_to(merged).parts[0] for p in merged_files if p.relative_to(merged).parts})
          report = [
              'Movera Drider extraction report',
              '===============================',
              f'Total reconstructed files: {len(merged_files)}',
              '',
              'Archive contents:',
          ]
          report += [f'- {name}: {count} files' for name, count in archive_stats]
          report += ['', 'Top-level reconstructed entries:']
          report += [f'- {name}' for name in top]
          report += ['', 'Conflicting duplicate paths: none']
          (repo / '.extraction-report.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          (repo / '.project-extracted').write_text('extracted\n', encoding='utf-8')
          shutil.rmtree(temp)
          PY

      - name: Commit reconstructed project tree
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No extraction changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: extract uploaded Movera Drider project"
          git push origin HEAD:chore/extract-uploaded-project
