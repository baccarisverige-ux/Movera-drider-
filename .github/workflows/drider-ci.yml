name: Frontend browser candidate probe
on:
  push:
    branches: ['audit/phase-final-browser-sweep-20261008']
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: driver-verification-347e6d876dd862326b1b36e01fbd6aec23caed3c
          run-id: 37770005646
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate
      - name: Install Playwright CLI
        run: npm install --prefix /tmp/movera-browser @playwright/cli
      - name: Probe compiled candidate in Chrome
        run: |
          mkdir -p output/playwright
          export PATH="/tmp/movera-browser/node_modules/.bin:$PATH"
          python3 -m http.server 8080 --directory candidate/build/web > /tmp/movera-browser-http.log 2>&1 &
          movera_server_pid=$!
          trap 'kill "$movera_server_pid" || true' EXIT
          playwright-cli --version
          playwright-cli open http://127.0.0.1:8080 --browser=chrome
          playwright-cli resize 320 568
          playwright-cli snapshot --filename=output/playwright/before-semantics.yml
          playwright-cli run-code "async page => { const enable = page.getByRole('button', {name: 'Enable accessibility'}); if (await enable.count()) await enable.dispatchEvent('click'); await page.waitForTimeout(5000); }"
          playwright-cli snapshot --filename=output/playwright/home.yml
          cat output/playwright/home.yml
          playwright-cli screenshot --filename=output/playwright/candidate-home-320.png
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Deny', exact: true}).click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/home-ready.yml
          cat output/playwright/home-ready.yml
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Menu', exact: true}).click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/menu.yml
          cat output/playwright/menu.yml
          playwright-cli screenshot --filename=output/playwright/candidate-menu-320.png
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Profile Account, vehicle and documents', exact: true}).click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/profile.yml
          cat output/playwright/profile.yml
          playwright-cli screenshot --filename=output/playwright/candidate-profile-320.png
          playwright-cli run-code "async page => { await page.getByRole('button', {name: /^Vehicles/}).click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/vehicles.yml
          cat output/playwright/vehicles.yml
          playwright-cli screenshot --filename=output/playwright/candidate-vehicles-320.png
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Back', exact: true}).or(page.getByRole('button').filter({hasText: 'Back'})).first().click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/profile-return.yml
          cat output/playwright/profile-return.yml
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Back', exact: true}).or(page.getByRole('button').filter({hasText: 'Back'})).first().click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/home-return.yml
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Menu', exact: true}).click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/menu-return.yml
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Scheduled rides Reservations and accepted trips', exact: true}).click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/scheduled.yml
          cat output/playwright/scheduled.yml
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Accepted', exact: true}).click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/accepted.yml
          cat output/playwright/accepted.yml
          playwright-cli screenshot --filename=output/playwright/candidate-accepted-320.png
          playwright-cli console error
          playwright-cli close
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-browser-probe-${{ github.sha }}
          path: |
            output/playwright/
            .playwright-cli/
