name: Frontend compiled browser verification

on:
  push:
    branches:
      - main
      - chore/drider-phase0-1-baseline
      - 'audit/phase-*'
  pull_request:
    branches:
      - main
      - 'audit/phase-*'

permissions:
  contents: read

concurrency:
  # One group per commit and event so a base-branch update cannot cancel
  # the head run and leave a red cancelled check on the pull request.
  group: drider-ci-${{ github.workflow }}-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test test/audit/layout_viewport_resize_test.dart test/audit/profile_and_schedule_handoff_test.dart

      - name: Frontend release evidence contracts
        run: |
          python3 -m unittest discover -s tool/tests -p 'test_frontend_release.py' -v
          python3 tool/check_frontend_release.py docs/frontend-completion/09-release-candidate.json

      - name: Driver web camera gesture contracts
        run: node tool/verify_driver_map_web.cjs

      - name: Critical lifecycle
        run: flutter test integration_test/driver_lifecycle_test.dart -d flutter-tester

      - name: Build web
        run: flutter build web --release

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-verification-${{ github.sha }}
          path: |
            build/web/
            output/playwright/
            build/test-evidence/
            test/failures/
          if-no-files-found: ignore
