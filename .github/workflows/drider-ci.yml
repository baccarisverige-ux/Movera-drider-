name: Frontend compiled browser verification

on:
  push:
    branches:
      - main
      - chore/drider-phase0-1-baseline
      - 'audit/phase-*'
  pull_request:
    branches:
      - main
      - 'audit/phase-*'

permissions:
  contents: read

concurrency:
  # One group per commit and event so a base-branch update cannot cancel
  # the head run and leave a red cancelled check on the pull request.
  group: drider-ci-${{ github.workflow }}-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test test/audit/profile_and_schedule_handoff_test.dart

      - name: Frontend release evidence contracts
        run: |
          python3 -m unittest discover -s tool/tests -p 'test_frontend_release.py' -v
          python3 tool/check_frontend_release.py docs/frontend-completion/09-release-candidate.json

      - name: Driver web camera gesture contracts
        run: node tool/verify_driver_map_web.cjs

      - name: Critical lifecycle
        run: flutter test integration_test/driver_lifecycle_test.dart -d flutter-tester

      - name: Build web
        run: flutter build web --release

      - name: Install Playwright CLI
        run: npm install --prefix /tmp/movera-browser @playwright/cli
      - name: Probe compiled candidate in Chrome
        run: |
          mkdir -p output/playwright
          export PATH="/tmp/movera-browser/node_modules/.bin:$PATH"
          python3 -m http.server 8080 --directory build/web > /tmp/movera-browser-http.log 2>&1 &
          movera_server_pid=$!
          trap 'kill "$movera_server_pid" || true' EXIT
          playwright-cli --version
          playwright-cli open http://127.0.0.1:8080 --browser=chrome
          playwright-cli resize 320 568
          playwright-cli snapshot --filename=output/playwright/before-semantics.yml
          playwright-cli run-code "async page => { const enable = page.getByRole('button', {name: 'Enable accessibility'}); if (await enable.count()) await enable.dispatchEvent('click'); await page.waitForTimeout(5000); }"
          playwright-cli snapshot --filename=output/playwright/home.yml
          cat output/playwright/home.yml
          playwright-cli screenshot --filename=output/playwright/candidate-home-320.png
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Deny', exact: true}).click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/home-ready.yml
          cat output/playwright/home-ready.yml
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Menu', exact: true}).click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/menu.yml
          cat output/playwright/menu.yml
          playwright-cli screenshot --filename=output/playwright/candidate-menu-320.png
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Profile Account, vehicle and documents', exact: true}).click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/profile.yml
          cat output/playwright/profile.yml
          playwright-cli screenshot --filename=output/playwright/candidate-profile-320.png
          playwright-cli run-code "async page => { await page.getByRole('button', {name: /^Vehicles/}).click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/vehicles.yml
          cat output/playwright/vehicles.yml
          playwright-cli screenshot --filename=output/playwright/candidate-vehicles-320.png
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Back', exact: true}).or(page.getByRole('button').filter({hasText: 'Back'})).first().click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/profile-return.yml
          cat output/playwright/profile-return.yml
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Back', exact: true}).or(page.getByRole('button').filter({hasText: 'Back'})).first().click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/menu-return.yml
          cat output/playwright/menu-return.yml
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Scheduled rides Reservations and accepted trips', exact: true}).click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/scheduled.yml
          cat output/playwright/scheduled.yml
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Accepted', exact: true}).click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/accepted.yml
          cat output/playwright/accepted.yml
          playwright-cli screenshot --filename=output/playwright/candidate-accepted-320.png
          playwright-cli run-code "async page => { await page.getByRole('button', {name: /^184.00 kr Tomorrow/}).click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/reservation-details.yml
          cat output/playwright/reservation-details.yml
          playwright-cli screenshot --filename=output/playwright/candidate-details-320.png
          playwright-cli resize 568 320
          playwright-cli snapshot --filename=output/playwright/reservation-landscape.yml
          playwright-cli screenshot --filename=output/playwright/candidate-details-landscape.png
          playwright-cli resize 320 568
          playwright-cli snapshot --filename=output/playwright/reservation-portrait.yml
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Cancel reservation', exact: true}).click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/cancellation-reasons.yml
          cat output/playwright/cancellation-reasons.yml
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Vehicle issue', exact: true}).click(); await page.waitForTimeout(300); }"
          playwright-cli snapshot --filename=output/playwright/cancellation-selected.yml
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Continue', exact: true}).click(); await page.waitForTimeout(700); }"
          playwright-cli snapshot --filename=output/playwright/cancellation-confirmation.yml
          cat output/playwright/cancellation-confirmation.yml
          playwright-cli screenshot --filename=output/playwright/candidate-confirmation-320.png
          playwright-cli run-code "async page => { await page.getByRole('button', {name: 'Cancel reservation', exact: true}).click(); await page.waitForTimeout(700); if (await page.getByRole('button', {name: /^184.00 kr Tomorrow/}).count()) throw new Error('Cancelled sample reservation still visible'); await page.getByText('Reservation cancelled', {exact: true}).waitFor({state: 'visible'}); }"
          playwright-cli snapshot --filename=output/playwright/cancellation-result.yml
          cat output/playwright/cancellation-result.yml
          playwright-cli screenshot --filename=output/playwright/candidate-cancelled-320.png
          playwright-cli console error
          playwright-cli close
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-verification-${{ github.sha }}
          path: |
            build/web/
            output/playwright/
            build/test-evidence/
            test/failures/
          if-no-files-found: ignore
