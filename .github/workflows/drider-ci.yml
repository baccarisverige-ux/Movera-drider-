name: Drider CI

on:
  push:
    branches:
      - main
      - chore/drider-phase0-1-baseline
      - 'audit/phase-*'
  pull_request:
    branches:
      - main
      - 'audit/phase-*'

permissions:
  contents: read

concurrency:
  # One group per commit and event so a base-branch update cannot cancel
  # the head run and leave a red cancelled check on the pull request.
  group: drider-ci-${{ github.workflow }}-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release
