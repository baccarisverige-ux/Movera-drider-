name: Drider CI

on:
  push:
    branches:
      - main
      - chore/drider-phase0-1-baseline
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: drider-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Drider
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release
