name: Map Color Lab Preview Build

on:
  push:
    branches:
      - feat/live-map-color-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Driver preview branch
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Configure Google Maps
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.Maps131189 }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "The Maps131189 repository secret is missing or empty."
            exit 1
          fi
          sed -i "s|GOOGLE_MAPS_API_KEY|$GOOGLE_MAPS_API_KEY|g" web/index.html

      - name: Build isolated preview
        run: flutter build web --release --base-href "/driver-movera-1/"

      - name: Upload isolated preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: map-color-lab-preview
          path: build/web
          if-no-files-found: error
          retention-days: 7
