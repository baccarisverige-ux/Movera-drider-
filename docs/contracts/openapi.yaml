components:
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Bound to authenticated actor, route and request hash. Repeating
        the same key returns the same committed projection; changed payload is 409.
  schemas:
    TripStatus:
      type: string
      enum:
      - draft
      - quoted
      - requested
      - searching
      - offered
      - accepted
      - driver_to_pickup
      - arrived
      - rider_onboard
      - in_trip
      - approaching_dropoff
      - completed
      - cancelled_by_rider
      - cancelled_by_driver
      - cancelled_by_admin
      - no_show
      - expired
      - failed
    DriverOnlineStatus:
      type: string
      enum:
      - offline
      - going_online
      - online
      - on_trip
      - suspended
    GeoPoint:
      type: object
      required:
      - lat
      - lng
      - measuredAt
      - accuracy
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        accuracy:
          type: number
          minimum: 0
        heading:
          type: number
        measuredAt:
          type: string
          format: date-time
    RealtimeEnvelope:
      type: object
      required:
      - tripId
      - kind
      - sequence
      - at
      properties:
        tripId:
          type: string
        kind:
          type: string
          enum:
          - trip_projection
          - rider_cancelled
          - location
          - driver_arrived
          - rider_on_the_way
        sequence:
          type: integer
          minimum: 1
        at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/TripStatus'
        lat:
          type: number
        lng:
          type: number
      description: Contiguous sequence per trip, never global. Subscribe then fetch
        authoritative projection. Reconnect fetches state plus sequence cursor before
        deltas. Terminal outcomes dominate later live events. Location does not replace
        cached lifecycle projection.
    DriverCancelReason:
      type: string
      enum:
      - rider_requested_cancel
      - rider_not_at_pickup
      - unsafe_pickup
      - vehicle_issue_before_start
      - driver_emergency_before_start
      - other_before_start
      - rider_requested_early_end
      - safety_concern_on_trip
      - vehicle_issue_on_trip
      - accident_or_road_emergency
      - rider_behavior
      - trip_or_destination_issue
      - other_on_trip
    TripProjection:
      type: object
      required:
      - tripId
      - status
      - version
      - sequence
      - updatedAt
      properties:
        tripId:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/TripStatus'
        version:
          type: integer
          minimum: 1
        sequence:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        pickup:
          $ref: '#/components/schemas/GeoPoint'
        dropoff:
          $ref: '#/components/schemas/GeoPoint'
        fare:
          $ref: '#/components/schemas/Money'
    Money:
      type: object
      required:
      - minorUnits
      - currency
      properties:
        minorUnits:
          type: integer
        currency:
          type: string
          const: SEK
    Error:
      type: object
      required:
      - code
      - message
      - requestId
      - retryable
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        projection:
          $ref: '#/components/schemas/TripProjection'
    TripCommand:
      type: object
      required:
      - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        location:
          $ref: '#/components/schemas/GeoPoint'
        verifiedPinToken:
          type: string
          description: Short-lived server proof; raw PIN is never persisted or logged.
        reasonCode:
          $ref: '#/components/schemas/DriverCancelReason'
    OfferList:
      type: object
      required: [offers]
      properties:
        offers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
    Offer:
      type: object
      required: [offerId, pickup, dropoff, fare, expiresAt]
      properties:
        offerId: {type: string}
        category: {type: string}
        pickup: {$ref: '#/components/schemas/GeoPoint'}
        dropoff: {$ref: '#/components/schemas/GeoPoint'}
        pickupAddress: {type: string}
        dropoffAddress: {type: string}
        fare: {$ref: '#/components/schemas/Money'}
        expiresAt: {type: string, format: date-time}
        followsDestination: {type: boolean}
    TripEventPage:
      type: object
      required: [projection, events, cursor]
      properties:
        projection: {$ref: '#/components/schemas/TripProjection'}
        events:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeEnvelope'
        cursor: {type: string, description: Pass back to resume after the last event.}
    PinVerifyRequest:
      type: object
      required: [pin, expectedVersion]
      properties:
        pin: {type: string, pattern: '^[0-9]{4}$', description: Never logged or persisted by client or server logs.}
        expectedVersion: {type: integer, minimum: 1}
    PinVerification:
      type: object
      required: [verifiedPinToken, expiresAt]
      properties:
        verifiedPinToken: {type: string}
        expiresAt: {type: string, format: date-time}
        attemptsRemaining: {type: integer, minimum: 0}
    Message:
      type: object
      required: [messageId, clientMessageId, sender, text, sentAt]
      properties:
        messageId: {type: string}
        clientMessageId: {type: string}
        sender: {type: string, enum: [driver, rider, system]}
        text: {type: string, maxLength: 1000}
        sentAt: {type: string, format: date-time}
    MessageCreate:
      type: object
      required: [clientMessageId, text]
      properties:
        clientMessageId: {type: string}
        text: {type: string, minLength: 1, maxLength: 1000}
    MessagePage:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        cursor: {type: string}
    RatingCreate:
      type: object
      required: [stars]
      properties:
        stars: {type: integer, minimum: 1, maximum: 5}
        tags:
          type: array
          items: {type: string}
    LocationSample:
      type: object
      required: [point, measuredAt, accuracyMeters]
      properties:
        point: {$ref: '#/components/schemas/GeoPoint'}
        measuredAt: {type: string, format: date-time}
        accuracyMeters: {type: number, minimum: 0}
        headingDegrees: {type: number}
        tripId: {type: string}
    LocationBatch:
      type: object
      required: [samples]
      properties:
        samples:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/LocationSample'
    HistoryEntry:
      type: object
      required: [tripId, status, occurredAt]
      properties:
        tripId: {type: string}
        status: {$ref: '#/components/schemas/TripStatus'}
        occurredAt: {type: string, format: date-time}
        fare: {$ref: '#/components/schemas/Money'}
        tip: {$ref: '#/components/schemas/Money'}
        distanceMeters: {type: number}
        durationSeconds: {type: number}
        cancellationActor: {type: string, enum: [driver, rider, admin, system]}
        cancellationReasonCode: {type: string}
    HistoryPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'
        cursor: {type: string}
    SupportTicketCreate:
      type: object
      required: [category, subject, message]
      properties:
        category: {type: string}
        subject: {type: string, maxLength: 200}
        message: {type: string, maxLength: 5000}
        tripId: {type: string}
    SupportTicket:
      type: object
      required: [ticketId, status, createdAt]
      properties:
        ticketId: {type: string}
        status: {type: string, enum: [open, awaitingDriver, resolved]}
        subject: {type: string}
        createdAt: {type: string, format: date-time}
    SupportTicketList:
      type: object
      required: [tickets]
      properties:
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/SupportTicket'
    VehicleCreate:
      type: object
      required: [make, model, year, plate]
      properties:
        make: {type: string}
        model: {type: string}
        year: {type: integer}
        plate: {type: string}
    Vehicle:
      type: object
      required: [vehicleId, make, model, year, plate, verification]
      properties:
        vehicleId: {type: string}
        make: {type: string}
        model: {type: string}
        year: {type: integer}
        plate: {type: string}
        verification: {type: string, enum: [pending, verified, rejected]}
        active: {type: boolean}
    VehicleList:
      type: object
      required: [vehicles]
      properties:
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
    DocumentUpload:
      type: object
      required: [kind, file]
      properties:
        kind: {type: string, enum: [driverLicense, taxiLicense, trafficPermit, vehicleRegistration, insurance, profilePhoto]}
        vehicleId: {type: string}
        file: {type: string, format: binary, description: JPEG or PNG, max 5 MB.}
    DriverDocument:
      type: object
      required: [documentId, kind, verification]
      properties:
        documentId: {type: string}
        kind: {type: string}
        verification: {type: string, enum: [pending, verified, rejected, expired]}
        expiresAt: {type: string, format: date}
    Payout:
      type: object
      required: [payoutId, amount, status, createdAt]
      properties:
        payoutId: {type: string}
        amount: {$ref: '#/components/schemas/Money'}
        status: {type: string, enum: [scheduled, paid, failed]}
        createdAt: {type: string, format: date-time}
    PayoutPage:
      type: object
      required: [balance, payouts]
      properties:
        balance: {$ref: '#/components/schemas/Money'}
        payouts:
          type: array
          items:
            $ref: '#/components/schemas/Payout'
        cursor: {type: string}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []
