openapi: 3.1.0
info:
  title: Movera Contracts
  version: 0.3.0
  description: Proposed integration contract only. No backend, authentication provider
    or transport is installed. Backend review and contract integration tests are required
    before enabling operational features. Currency SEK; tripId is canonical.
servers:
- url: https://api.dev.movera.invalid/api/v1
paths:
  /trips/{tripId}:
    get:
      operationId: getTrip
      parameters:
      - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Trip projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripProjection'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Actor not authorized for trip or admin scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version, idempotency or claimed-offer conflict; includes authoritative
            projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Lifecycle, location freshness or PIN verification rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited; obey Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable; retry with same idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trips:
