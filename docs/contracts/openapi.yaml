openapi: 3.1.0
info:
  title: Movera Contracts
  version: 0.2.0
  description: Proposed integration contract only. No backend, authentication provider
    or transport is installed. Backend review and contract integration tests are required
    before enabling operational features. Currency SEK; tripId is canonical.
