components:
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Bound to authenticated actor, route and request hash. Repeating
        the same key returns the same committed projection; changed payload is 409.
  schemas:
    TripStatus:
      type: string
      enum:
      - draft
      - quoted
      - requested
      - searching
      - offered
      - accepted
      - driver_to_pickup
      - arrived
      - rider_onboard
      - in_trip
      - approaching_dropoff
      - completed
      - cancelled_by_rider
      - cancelled_by_driver
      - cancelled_by_admin
      - no_show
      - expired
      - failed
    DriverOnlineStatus:
      type: string
      enum:
      - offline
      - going_online
      - online
      - on_trip
      - suspended
    GeoPoint:
      type: object
      required:
      - lat
      - lng
      - measuredAt
      - accuracy
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        accuracy:
          type: number
          minimum: 0
        heading:
          type: number
        measuredAt:
          type: string
          format: date-time
    RealtimeEnvelope:
      type: object
      required:
      - tripId
      - kind
      - sequence
      - at
      properties:
        tripId:
          type: string
        kind:
          type: string
          enum:
          - trip_projection
          - rider_cancelled
          - location
          - driver_arrived
          - rider_on_the_way
        sequence:
          type: integer
          minimum: 1
        at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/TripStatus'
        lat:
          type: number
        lng:
          type: number
      description: Contiguous sequence per trip, never global. Subscribe then fetch
        authoritative projection. Reconnect fetches state plus sequence cursor before
        deltas. Terminal outcomes dominate later live events. Location does not replace
        cached lifecycle projection.
    DriverCancelReason:
      type: string
      enum:
      - rider_requested_cancel
      - rider_not_at_pickup
      - unsafe_pickup
      - vehicle_issue_before_start
      - driver_emergency_before_start
      - other_before_start
      - rider_requested_early_end
      - safety_concern_on_trip
      - vehicle_issue_on_trip
      - accident_or_road_emergency
      - rider_behavior
      - trip_or_destination_issue
      - other_on_trip
    TripProjection:
      type: object
      required:
      - tripId
      - status
      - version
      - sequence
      - updatedAt
      properties:
        tripId:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/TripStatus'
        version:
          type: integer
          minimum: 1
        sequence:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        pickup:
          $ref: '#/components/schemas/GeoPoint'
        dropoff:
          $ref: '#/components/schemas/GeoPoint'
        fare:
          $ref: '#/components/schemas/Money'
    Money:
      type: object
      required:
      - minorUnits
      - currency
      properties:
        minorUnits:
          type: integer
        currency:
          type: string
          const: SEK
    Error:
      type: object
      required:
      - code
      - message
      - requestId
      - retryable
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        projection:
          $ref: '#/components/schemas/TripProjection'
    TripCommand:
      type: object
      required:
      - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        location:
          $ref: '#/components/schemas/GeoPoint'
        verifiedPinToken:
          type: string
          description: Short-lived server proof; raw PIN is never persisted or logged.
        reasonCode:
          $ref: '#/components/schemas/DriverCancelReason'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []
