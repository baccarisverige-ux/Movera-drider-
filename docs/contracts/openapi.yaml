      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              - expectedVersion
              properties:
                status:
                  type: string
                  enum:
                  - offline
                  - online
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Authoritative availability; active trip remains occupied
        '409':
          description: Occupied, suspended or outdated version
        '401':
          description: Authentication required
        '403':
